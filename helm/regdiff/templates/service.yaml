apiVersion: v1
kind: Service
metadata:
  name: regdiff-backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.backendPort }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: regdiff-backend
---
apiVersion: v1
kind: Service
metadata:
  name: regdiff-frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: regdiff-frontend
