version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: regdiff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: regdiff_user
      POSTGRES_PASSWORD: regdiff_password
      POSTGRES_DB: regdiff_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regdiff_user -d regdiff_production"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: regdiff-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: regdiff-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://regdiff_user:regdiff_password@postgres:5432/regdiff_production
      REDIS_URL: redis://redis:6379/0
      PROJECT_NAME: "RegDiff Enterprise Continuous Compliance"
      API_V1_PREFIX: "/api/v1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: regdiff-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
